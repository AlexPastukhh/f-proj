name: Windows source proofs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    name: Node + .NET read-only proofs
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install TypeScript dependencies
        run: npm ci
      - name: Restore .NET worker and Roslyn fixture projects
        shell: pwsh
        run: |
          dotnet restore workers/dotnet/FeatureProjection.DotNetWorker.csproj --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore fixtures/responsibility-proof/Responsibility.FeatureTests.csproj --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore fixtures/assertion-helper-proof/AssertionHelper.FeatureTests.csproj --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore full Vitest/xUnit fixture for normalized JSON feasibility
        shell: pwsh
        run: |
          npm ci --prefix fixtures/workspace/frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore fixtures/workspace/backend/Backend.FeatureTests.csproj --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests and TypeScript build
        run: npm test
      - name: Semantic registered C# usage proof
        run: node scripts/verify-usage-symbol-feasibility.mjs
      - name: In-memory C# Rename feasibility proof (no source edits)
        run: node scripts/verify-rename-feasibility.mjs
      - name: Internal JSON, metadata disclosure, and Portable Markdown/HTML fixture proof
        run: node scripts/verify-experimental-json-snapshot.mjs
      - name: D-068 known-input drift probe (no cache reuse)
        run: node scripts/verify-refresh-input-probe.mjs
      - name: D-069 opt-in Vitest static-cache full engine equivalence
        run: node scripts/verify-vitest-static-cache.mjs
      - name: D-070 safe timing study (no production cache activation)
        run: node scripts/measure-vitest-static-cache.mjs 12
      - name: Package .NET worker and verify payload
        shell: pwsh
        run: |
          npm run build:dotnet-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:packaged-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: D-071 opt-in Roslyn phase profiling (no caching or timing threshold)
        run: node scripts/measure-roslyn-phases.mjs 2
      - name: P4 first slice exact Vitest Situation execution
        run: node scripts/verify-p4-vitest-run.mjs
      - name: P4 Backend Fact and folded Theory fail-closed proof
        run: node scripts/verify-p4-backend-run.mjs
      - name: P4 exact individually pre-enumerated xUnit Theory rows
        run: node scripts/verify-p4-xunit-theory-run.mjs
      - name: P4 Run Both one complete Situation (Frontend then Backend)
        run: node scripts/verify-p4-run-both.mjs
      - name: D-077 cancel running Vitest and xUnit test processes
        run: node scripts/verify-p4-cancellation.mjs
      - name: P4 cancellation of running Vitest and xUnit user tests
        run: node scripts/verify-p4-cancellation.mjs

# This source-proof job is not installed-extension acceptance.
# The isolated VSIX smoke (trusted/restricted, scoped links, P2
# regressions) is a separate required pre-release technical gate.
